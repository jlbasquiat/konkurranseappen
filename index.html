<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Har vi det gøy nå?</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #F3B562;
            color: #5C4B51;
        }


        .konkurranse {
            border: 1px solid #5C4B51;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            background-color: #F2EBBF;
            box-shadow: 0 4px 15px rgba(92, 75, 81, 0.15);
        }


        input {
            padding: 12px;
            font-size: 18px;
            width: 250px;
            margin: 10px;
            border: 1px solid #5C4B51;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            color: #5C4B51;
            background-color: white;
        }


        input::placeholder {
            color: #5C4B51;
            opacity: 0.7;
        }


        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            border: 1px solid #5C4B51;
            border-radius: 8px;
            background-color: white;
            color: #5C4B51;
        }


        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }


        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        /* STARTKNAPP */

        #startKnapp {
            background-color: #ccc;
            color: white;
            border-color: #ccc;
        }


        #startKnapp:not(:disabled) {
            background-color: #2e9d50;
            border-color: #2e9d50;
            color: white;
            cursor: pointer;
        }


        /* SVARALTERNATIVER */

        #svaralternativer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }


        #svaralternativer button {
            width: 280px;
            min-height: 55px;
            font-size: 20px;
            border-radius: 10px;
        }


        /* RIKTIG SVAR */

        #svaralternativer button.riktig {
            background-color: #2e9d50;
            color: white;
            border-color: #2e9d50;
        }


        /* FEIL SVAR */

        #svaralternativer button.feil {
            background-color: #d64545;
            color: white;
            border-color: #d64545;
        }


        /* SPØRSMÅL */

        #sporsmal {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            color: #5C4B51;
        }


        #sporsmalTeller {
            font-size: 16px;
            color: #5C4B51;
            opacity: 0.7;
        }


        /* POENG */

        #poengVisning {
            font-size: 20px;
            font-weight: bold;
            color: #5C4B51;
        }


        /* RESULTATLISTE */

        #resultatliste {
            margin-top: 30px;
            width: 100%;
            text-align: center;
            color: #5C4B51;
        }


        #resultatliste h3 {
            text-align: center;
            margin-bottom: 25px;
            color: #5C4B51;
        }


        .resultatrad {
            width: 100%;
            text-align: center;
            margin: 0 auto 25px auto;
            color: #5C4B51;
        }


        .resultatrad strong {
            display: block;
            width: 100%;
            text-align: center;
            color: #5C4B51;
        }


        .resultatdato {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #5C4B51;
            opacity: 0.7;
            margin-top: 4px;
        }


        /* TOPP 5 */

        #toppFem {
            margin-top: 30px;
            width: 100%;
            text-align: center;
            color: #5C4B51;
        }


        #toppFem h3 {
            text-align: center;
            margin-bottom: 25px;
            color: #5C4B51;
        }


        #toppFem p {
            width: 100%;
            margin: 0 auto 20px auto;
            padding: 8px 0;
            text-align: center !important;
            color: #5C4B51;
        }


        /* NESTE-KNAPP */

        #neste {
            display: block;
            margin: 15px auto 0 auto;
        }


        /* MOBIL */

        @media (max-width: 600px) {

            body {
                margin: 10px auto;
                padding: 15px;
            }


            .konkurranse {
                padding: 20px;
                margin-top: 20px;
            }


            input {
                width: 80%;
                max-width: 300px;
                text-align: center;
            }


            #svaralternativer button {
                width: 100%;
                max-width: 320px;
                min-height: 60px;
            }


            #sporsmal {
                font-size: 24px;
            }

        }

    </style>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- FORSIDE -->

    <div id="startside" class="konkurranse">

        <p>
            Skriv inn navnet ditt, og klikk start.
        </p>


        <input
            type="text"
            id="navn"
            placeholder="Ditt navn"
            autocomplete="off"
        >


        <br>


        <button
            id="startKnapp"
            onclick="startKonkurranse()"
            disabled
        >
            Start
        </button>


        <!-- TOPP 5 -->

        <div id="toppFem">

            <h3>Topp 5</h3>

            <p>
                Laster resultater...
            </p>

        </div>

    </div>


    <!-- QUIZ -->

    <div
        id="quiz"
        class="konkurranse"
        style="display: none;"
    >

        <p>
            Spiller:
            <strong id="spiller"></strong>
        </p>


        <p id="poengVisning">
            ⭐ Poeng:
            <span id="poeng">0</span>
        </p>


        <p id="sporsmal"></p>


        <p id="sporsmalTeller"></p>


        <div id="svaralternativer"></div>


        <p id="resultat"></p>


        <div id="resultatliste"></div>


        <button
            id="neste"
            onclick="nesteSporsmal()"
            style="display: none;"
        >
            Neste ➡️
        </button>

    </div>


    <script>

        /* VARIABLER */

        let poeng = 0;

        let sporsmalNummer = 0;

        let navn = "";


        /* SUPABASE */

        const supabaseUrl =
            "https://ukxevteqkihqfycqjrou.supabase.co";


        const supabaseKey =
            "sb_publishable_ulauPK9fAZF8ndLKUlACxg_uvNnGtiU";


        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        /* SPØRSMÅL */

        let sporsmal = [

            {
                tekst: "Hva er hovedstaden i Norge?",
                svar: [
                    "Oslo",
                    "Bergen",
                    "Trondheim"
                ],
                riktig: "Oslo"
            },


            {
                tekst: "Hvilken planet er nærmest solen?",
                svar: [
                    "Jorden",
                    "Merkur",
                    "Mars"
                ],
                riktig: "Merkur"
            },


            {
                tekst: "Hvor mange dager er det i en uke?",
                svar: [
                    "5",
                    "7",
                    "10"
                ],
                riktig: "7"
            },


            {
                tekst: "Hvilket dyr er kjent som menneskets beste venn?",
                svar: [
                    "Katt",
                    "Hund",
                    "Hest"
                ],
                riktig: "Hund"
            },


            {
                tekst: "Hva heter Norges lengste elv?",
                svar: [
                    "Glomma",
                    "Drammenselva",
                    "Lågen"
                ],
                riktig: "Glomma"
            }

        ];


        /* STARTKNAPP */

        document
            .getElementById("navn")
            .addEventListener(
                "input",
                function() {

                    let navnInput =
                        document.getElementById("navn");


                    let startKnapp =
                        document.getElementById("startKnapp");


                    if (
                        navnInput.value.trim() === ""
                    ) {

                        startKnapp.disabled = true;

                    } else {

                        startKnapp.disabled = false;

                    }

                }
            );


        /* START KONKURRANSE */

        function startKonkurranse() {

            navn =
                document
                    .getElementById("navn")
                    .value
                    .trim();


            document
                .getElementById("spiller")
                .textContent =
                    navn;


            document
                .getElementById("startside")
                .style.display =
                    "none";


            document
                .getElementById("quiz")
                .style.display =
                    "block";


            visSporsmal();

        }


        /* BLAND SVAR */

        function blandSvar(svar) {

            return svar.sort(
                () => Math.random() - 0.5
            );

        }


        /* VIS SPØRSMÅL */

        function visSporsmal() {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            document
                .getElementById("sporsmalTeller")
                .textContent =
                    "Spørsmål " +
                    (sporsmalNummer + 1) +
                    " av " +
                    sporsmal.length;


            document
                .getElementById("sporsmal")
                .textContent =
                    aktueltSporsmal.tekst;


            let svaralternativer =
                document.getElementById(
                    "svaralternativer"
                );


            svaralternativer.innerHTML =
                "";


            blandSvar(
                aktueltSporsmal.svar
            ).forEach(
                function(alternativ) {

                    let knapp =
                        document.createElement(
                            "button"
                        );


                    knapp.textContent =
                        alternativ;


                    knapp.onclick =
                        function() {

                            svar(
                                alternativ,
                                knapp
                            );

                        };


                    svaralternativer
                        .appendChild(knapp);

                }
            );


            document
                .getElementById("neste")
                .style.display =
                    "none";

        }


        /* SVAR */

        function svar(valg, klikketKnapp) {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            let knapper =
                document.querySelectorAll(
                    "#svaralternativer button"
                );


            /* DEAKTIVER ALLE SVARKNAPPER */

            knapper.forEach(
                function(knapp) {

                    knapp.disabled = true;

                }
            );


            /* VIS OM VALGET VAR RIKTIG ELLER FEIL */

            if (
                valg ===
                aktueltSporsmal.riktig
            ) {

                poeng++;


                document
                    .getElementById("poeng")
                    .textContent =
                        poeng;


                klikketKnapp.classList.add(
                    "riktig"
                );

            } else {

                klikketKnapp.classList.add(
                    "feil"
                );

            }


            /* VIS NESTE-KNAPP */

            document
                .getElementById("neste")
                .style.display =
                    "block";

        }


        /* NESTE SPØRSMÅL */

        async function nesteSporsmal() {

            sporsmalNummer++;


            if (
                sporsmalNummer <
                sporsmal.length
            ) {

                visSporsmal();

            } else {

                document
                    .getElementById("sporsmal")
                    .textContent =
                        "🎉 Konkurransen er ferdig!";


                document
                    .getElementById(
                        "svaralternativer"
                    )
                    .innerHTML =
                        "";


                document
                    .getElementById("resultat")
                    .textContent =
                        navn +
                        ", du fikk " +
                        poeng +
                        " av " +
                        sporsmal.length +
                        " poeng!";


                document
                    .getElementById("neste")
                    .style.display =
                        "none";


                /* LAGRE RESULTAT */

                let { error } =
                    await supabaseClient
                        .from("Resultater")
                        .insert({
                            navn: navn,
                            poeng: poeng
                        });


                if (error) {

                    console.error(
                        "Feil ved lagring:",
                        error
                    );


                    document
                        .getElementById("resultat")
                        .textContent +=
                            " ⚠️ Resultatet kunne ikke lagres.";

                } else {

                    await visResultatliste();

                }


                /* SPILL IGJEN */

                let spillIgjen =
                    document.createElement(
                        "button"
                    );


                spillIgjen.textContent =
                    "🔄 Spill igjen";


                spillIgjen.onclick =
                    function() {

                        location.reload();

                    };


                document
                    .getElementById(
                        "svaralternativer"
                    )
                    .appendChild(
                        spillIgjen
                    );

            }

        }


        /* RESULTATLISTE */

        async function visResultatliste() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng, created_at"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    );


            let resultatliste =
                document.getElementById(
                    "resultatliste"
                );


            resultatliste.innerHTML =
                "<h3>🏆 Resultatliste</h3>";


            if (error) {

                resultatliste.innerHTML +=
                    "<p>Kunne ikke hente resultatlisten.</p>";


                console.error(
                    "Feil ved henting av resultater:",
                    error
                );


                return;

            }


            data.forEach(
                function(resultat) {

                    let rad =
                        document.createElement(
                            "div"
                        );


                    rad.className =
                        "resultatrad";


                    let dato =
                        new Date(
                            resultat.created_at
                        );


                    let datoFormatert =
                        dato.toLocaleDateString(
                            "no-NO"
                        );


                    rad.innerHTML =
                        "<strong>" +
                        resultat.navn +
                        "</strong>" +

                        '<div class="resultatdato">' +

                        resultat.poeng +
                        "p, " +
                        datoFormatert +

                        "</div>";


                    resultatliste
                        .appendChild(rad);

                }
            );

        }


        /* TOPP 5 PÅ FORSIDEN */

        async function visToppFem() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    )
                    .limit(5);


            let toppFem =
                document.getElementById(
                    "toppFem"
                );


            if (error) {

                toppFem.innerHTML =
                    "<h3>Topp 5</h3>" +
                    "<p>Kunne ikke hente resultater.</p>";


                console.error(
                    "Feil ved henting av topp 5:",
                    error
                );


                return;

            }


            toppFem.innerHTML =
                "<h3>Topp 5</h3>";


            data.forEach(
                function(resultat, index) {

                    let rad =
                        document.createElement(
                            "p"
                        );


                    rad.textContent =
                        (index + 1) +
                        ". " +
                        resultat.navn +
                        " – " +
                        resultat.poeng +
                        " poeng";


                    toppFem
                        .appendChild(rad);

                }
            );

        }


        /* HENT TOPP 5 NÅR SIDEN ÅPNES */

        visToppFem();

    </script>

</body>
</html>
