<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Har vi det gøy nå?</title>

    <style>

        /* =========================
           VANLIG MODUS
           ========================= */

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #E8DCC4;
            color: #354F52;
            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }


        /* =========================
           HEADER UNDER SPILLET
           ========================= */

        #spillHeader {
            position: fixed;

            top: 20px;
            left: 20px;
            right: 20px;

            z-index: 1000;

            display: grid;

            grid-template-columns: 1fr 2fr 1fr;

            align-items: center;

            pointer-events: none;
        }


        #poengVisning {
            justify-self: start;

            margin: 0;

            font-size: 20px;

            font-weight: bold;

            color: #354F52;

            text-align: left;

            pointer-events: none;
        }


        #spiller {
            justify-self: center;

            width: 100%;

            max-width: 300px;

            margin: 0;

            font-size: 20px;

            font-weight: bold;

            line-height: 1.15;

            color: #354F52;

            text-align: center;

            overflow-wrap: break-word;

            word-break: normal;
        }


        /* =========================
           DARK MODE TOGGLE
           ========================= */

        #darkModeToggle {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 1001;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 64px;
            height: 34px;

            margin: 0;
            padding: 0;

            border: 2px solid #52706B;
            border-radius: 20px;

            background-color: #F7F3EA;

            cursor: pointer;

            pointer-events: auto;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }


        #darkModeToggle:hover {
            transform: none;
        }


        #toggleKnapp {
            position: absolute;

            width: 26px;
            height: 26px;

            left: 3px;
            top: 2px;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 50%;

            background-color: #E8DCC4;

            pointer-events: none;

            transition:
                left 0.2s ease,
                background-color 0.2s ease;
        }


        #toggleIkon {
            position: absolute;

            top: 50%;
            right: 6px;

            transform: translateY(-50%);

            font-size: 15px;

            pointer-events: none;
        }


        /* =========================
           FORSIDE
           ========================= */

        #startside {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px 20px 10px;

            margin-top: 70px;
        }


        #startside p {
            margin: 0 0 18px;

            font-size: 20px;

            font-weight: bold;
        }


        /* =========================
           NAVNEFELT
           ========================= */

        input {
            padding: 14px;

            font-size: 18px;

            width: 280px;

            max-width: 90%;

            margin: 5px 0 12px;

            border: 1px solid #52706B;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            color: #354F52;

            background-color: #F7F3EA;

            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        input::placeholder {
            color: #354F52;

            opacity: 0.7;
        }


        /* =========================
           KNAPPER
           ========================= */

        button {
            padding: 12px 24px;

            font-size: 18px;

            cursor: pointer;

            margin: 5px;

            border: 1px solid #52706B;

            border-radius: 8px;

            background-color: #E6EDE9;

            color: #354F52;

            transition:
                transform 0.15s ease,
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }


        button:disabled {
            cursor: not-allowed;

            opacity: 0.5;
        }


        /* =========================
           STARTKNAPP
           ========================= */

        #startKnapp {
            min-width: 180px;

            padding: 15px 32px;

            margin-top: 2px;

            background-color: #B8C5C1;

            color: white;

            border-color: #B8C5C1;

            font-size: 20px;

            font-weight: bold;
        }


        #startKnapp:not(:disabled) {
            background-color: #4F8A78;

            border-color: #4F8A78;

            color: white;

            cursor: pointer;
        }


        /* =========================
           TOPP 5
           ========================= */

        #toppFemBoks {
            border: none;

            border-radius: 0;

            padding: 10px 0;

            margin: 45px auto 0;

            background-color: transparent;

            box-shadow: none;

            max-width: 430px;
        }


        #toppFem {
            width: 100%;

            text-align: center;

            color: #354F52;
        }


        #toppFem h3 {
            text-align: center;

            margin: 0 0 18px;

            font-size: 18px;

            font-weight: normal;

            color: #354F52;

            opacity: 0.75;
        }


        .toppRad {
            display: grid;

            grid-template-columns: 30px 180px 70px;

            align-items: center;

            width: 280px;

            margin: 0 auto 8px;

            padding: 5px 0;
        }


        .toppRad:last-child {
            margin-bottom: 0;
        }


        .toppNummer {
            text-align: left;

            font-size: 15px;

            font-weight: normal;

            opacity: 0.7;
        }


        .toppNavn {
            width: 180px;

            text-align: center;

            font-size: 15px;

            font-weight: normal;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .toppPoeng {
            text-align: right;

            font-size: 13px;

            opacity: 0.6;
        }


        /* =========================
           QUIZ
           ========================= */

        #quiz {
            margin-top: 90px;

            padding-bottom: 80px;
        }


        /* =========================
           SPØRSMÅL
           ========================= */

        #sporsmal {
            font-size: 28px;

            font-weight: bold;

            margin: 30px 0 12px;

            color: #354F52;

            line-height: 1.3;
        }


        #sporsmalTeller {
            font-size: 16px;

            color: #354F52;

            opacity: 0.7;

            margin-bottom: 20px;
        }


        /* =========================
           SVARALTERNATIVER
           ========================= */

        #svaralternativer {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            margin-top: 20px;
        }


        #svaralternativer button {
            width: 280px;

            min-height: 55px;

            font-size: 20px;

            border-radius: 10px;
        }


        #svaralternativer button.riktig {
            background-color: #4F8A78;

            color: white;

            border-color: #4F8A78;
        }


        #svaralternativer button.feil {
            background-color: #A94A4A;

            color: white;

            border-color: #A94A4A;
        }


        /* =========================
           NESTE
           ========================= */

        #neste {
            display: block;

            min-width: 150px;

            margin: 18px auto 0;

            padding: 14px 28px;

            background-color: #4F8A78;

            border-color: #4F8A78;

            color: white;

            font-size: 19px;

            font-weight: bold;
        }


        /* =========================
           AVBRYT-MENY
           ========================= */

        #avbrytOmrade {
            position: fixed;

            bottom: 18px;

            left: 0;
            right: 0;

            z-index: 900;

            display: flex;

            flex-direction: column;

            align-items: center;

            pointer-events: none;
        }


        #avbrytKnapp {
            min-width: 130px;

            padding: 9px 20px;

            margin: 0;

            font-size: 15px;

            background-color: #E6EDE9;

            color: #354F52;

            border-color: #52706B;

            pointer-events: auto;
        }


        #avbrytValg {
            display: none;

            flex-direction: column;

            align-items: center;

            margin-bottom: 5px;

            pointer-events: auto;
        }


        #leverInnKnapp {
            min-width: 190px;

            background-color: #4F8A78;

            color: white;

            border-color: #4F8A78;

            font-weight: bold;
        }


        #startPaNyttKnapp {
            min-width: 190px;

            background-color: #E6EDE9;

            color: #354F52;

            border-color: #52706B;

            font-weight: bold;
        }


        /* =========================
           SLUTTRESULTAT
           ========================= */

        #sluttresultat {
            font-size: 24px;

            font-weight: bold;

            line-height: 1.5;

            margin: 30px 0 20px;

            color: #354F52;
        }


        /* =========================
           SPILL IGJEN
           ========================= */

        #spillIgjen {
            display: block;

            min-width: 170px;

            margin: 0 auto;

            padding: 13px 24px;

            background-color: #E6EDE9;

            color: #354F52;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           RESULTATLISTE
           ========================= */

        #resultatlisteBoks {
            border: none;

            border-radius: 0;

            padding: 10px 0 0;

            margin-top: 30px;

            background-color: transparent;

            box-shadow: none;
        }


        #resultatliste {
            width: 100%;

            text-align: center;

            color: #354F52;
        }


        #resultatliste h3 {
            text-align: center;

            margin: 0 0 25px;

            font-size: 24px;

            color: #354F52;
        }


        .resultatrad {
            display: grid;

            grid-template-columns: 40px 220px 90px;

            align-items: center;

            width: 350px;

            margin: 0 auto 20px;

            color: #354F52;
        }


        .resultatrad:last-child {
            margin-bottom: 0;
        }


        .resultatPlassering {
            text-align: left;

            font-size: 19px;

            font-weight: bold;
        }


        .resultatNavn {
            width: 220px;

            text-align: center;

            font-size: 19px;

            font-weight: bold;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .resultatPoeng {
            text-align: right;

            font-size: 14px;

            opacity: 0.7;
        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        body.dark-mode {
            background-color: #263238;

            color: #8CBEB2;
        }


        body.dark-mode #poengVisning,
        body.dark-mode #spiller {
            color: #8CBEB2;
        }


        body.dark-mode #darkModeToggle {
            background-color: #37474F;

            border-color: #8CBEB2;
        }


        body.dark-mode #toggleKnapp {
            left: 33px;

            background-color: #8CBEB2;
        }


        body.dark-mode #toggleIkon {
            left: 7px;

            right: auto;
        }


        body.dark-mode #toppFem {
            color: #8CBEB2;
        }


        body.dark-mode #toppFem h3 {
            color: #8CBEB2;
        }


        body.dark-mode .toppNummer,
        body.dark-mode .toppNavn,
        body.dark-mode .toppPoeng {
            color: #8CBEB2;
        }


        body.dark-mode input {
            background-color: #263238;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode input::placeholder {
            color: #8CBEB2;
        }


        body.dark-mode button {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #startKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #455A64;
        }


        body.dark-mode #startKnapp:not(:disabled) {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #sporsmal,
        body.dark-mode #sporsmalTeller {
            color: #8CBEB2;
        }


        body.dark-mode #svaralternativer button.riktig {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #svaralternativer button.feil {
            background-color: #A94A4A;

            color: #F2EBBF;

            border-color: #A94A4A;
        }


        body.dark-mode #neste {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #avbrytKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #leverInnKnapp {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #startPaNyttKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #sluttresultat {
            color: #8CBEB2;
        }


        body.dark-mode #spillIgjen {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #resultatliste,
        body.dark-mode #resultatliste h3,
        body.dark-mode .resultatrad,
        body.dark-mode .resultatPlassering,
        body.dark-mode .resultatNavn,
        body.dark-mode .resultatPoeng {
            color: #8CBEB2;
        }


        /* =========================
           MOBIL
           ========================= */

        @media (max-width: 600px) {

            body {
                margin: 0 auto;

                padding: 12px;
            }


            #spillHeader {
                top: 12px;

                left: 12px;

                right: 12px;

                grid-template-columns: 1fr 2fr 1fr;
            }


            #darkModeToggle {
                top: 12px;

                right: 12px;
            }


            #poengVisning {
                font-size: 18px;
            }


            #spiller {
                max-width: 150px;

                font-size: 18px;
            }


            /* FORSIDE */

            #startside {
                padding: 15px 5px 5px;

                margin-top: 75px;
            }


            #startside p {
                font-size: 19px;

                margin-bottom: 15px;
            }


            input {
                width: 280px;

                max-width: 90%;
            }


            #startKnapp {
                min-width: 175px;
            }


            #toppFemBoks {
                margin-top: 40px;

                padding-top: 5px;
            }


            .toppRad {
                grid-template-columns: 30px 1fr 70px;

                width: 100%;

                max-width: 280px;
            }


            .toppNavn {
                width: 100%;
            }


            /* QUIZ */

            #quiz {
                margin-top: 85px;

                padding-bottom: 85px;
            }


            #svaralternativer button {
                width: 100%;

                max-width: 320px;

                min-height: 60px;
            }


            #sporsmal {
                font-size: 24px;

                margin: 25px 0 10px;
            }


            #avbrytOmrade {
                bottom: 12px;
            }


            #avbrytKnapp {
                min-width: 120px;

                padding: 8px 18px;

                font-size: 14px;
            }


            #toppFem h3,
            #resultatliste h3 {
                font-size: 20px;
            }


            .resultatrad {
                grid-template-columns: 35px 1fr 75px;

                width: 100%;

                max-width: 350px;
            }


            .resultatNavn {
                width: 100%;
            }


            #sluttresultat {
                font-size: 21px;
            }

        }

    </style>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =========================
         HEADER UNDER SPILLET
         ========================= -->

    <div
        id="spillHeader"
        style="display: none;"
    >

        <p id="poengVisning">
            ⭐ <span id="poeng">0</span>
        </p>


        <div id="spiller"></div>

    </div>


    <!-- =========================
         DARK MODE
         ========================= -->

    <button
        id="darkModeToggle"
        onclick="toggleDarkMode()"
        aria-label="Bytt mellom lys og mørk modus"
    >

        <span id="toggleKnapp"></span>

        <span id="toggleIkon">☀️</span>

    </button>


    <!-- =========================
         FORSIDE
         ========================= -->

    <div id="startside">

        <p>
            Klar for å spille?
        </p>


        <input
            type="text"
            id="navn"
            placeholder="Ditt navn"
            autocomplete="off"
            maxlength="20"
        >


        <button
            id="startKnapp"
            onclick="startKonkurranse()"
            disabled
        >
            START
        </button>

    </div>


    <!-- =========================
         TOPP 5
         ========================= -->

    <div
        id="toppFemBoks"
        class="listeboks"
    >

        <div id="toppFem">

            <h3>Topp 5</h3>

            <p>
                Laster resultater...
            </p>

        </div>

    </div>


    <!-- =========================
         QUIZ
         ========================= -->

    <div
        id="quiz"
        style="display: none;"
    >

        <p id="sporsmal"></p>


        <p id="sporsmalTeller"></p>


        <div id="svaralternativer"></div>


        <!-- NESTE -->

        <button
            id="neste"
            onclick="nesteSporsmal()"
            style="display: none;"
        >
            Neste ➡️
        </button>


        <!-- AVBRYT-OMRÅDE -->

        <div id="avbrytOmrade">

            <div id="avbrytValg">

                <button
                    id="leverInnKnapp"
                    onclick="leverInnSvar()"
                >
                    Lever inn svar
                </button>


                <button
                    id="startPaNyttKnapp"
                    onclick="startPaNytt()"
                >
                    Start på nytt
                </button>

            </div>


            <button
                id="avbrytKnapp"
                onclick="visAvbrytValg()"
            >
                Avbryt
            </button>

        </div>


        <!-- SLUTTRESULTAT -->

        <div
            id="sluttresultat"
            style="display: none;"
        ></div>


        <!-- SPILL IGJEN -->

        <button
            id="spillIgjen"
            style="display: none;"
            onclick="location.reload()"
        >
            🔄 Spill igjen
        </button>


        <!-- RESULTATLISTE -->

        <div
            id="resultatlisteBoks"
            style="display: none;"
        >

            <div id="resultatliste"></div>

        </div>

    </div>


    <script>

        /* =========================
           DARK MODE
           ========================= */

        function oppdaterDarkMode() {

            let erDarkMode =
                sessionStorage.getItem("darkMode") === "true";


            if (erDarkMode) {

                document.body.classList.add("dark-mode");

            } else {

                document.body.classList.remove("dark-mode");

            }


            let ikon =
                document.getElementById("toggleIkon");


            ikon.textContent =
                erDarkMode
                    ? "🌙"
                    : "☀️";

        }


        function toggleDarkMode() {

            let erDarkMode =
                document.body.classList.toggle(
                    "dark-mode"
                );


            sessionStorage.setItem(
                "darkMode",
                erDarkMode
            );


            let ikon =
                document.getElementById(
                    "toggleIkon"
                );


            ikon.textContent =
                erDarkMode
                    ? "🌙"
                    : "☀️";

        }


        oppdaterDarkMode();


        /* =========================
           VARIABLER
           ========================= */

        let poeng = 0;

        let sporsmalNummer = 0;

        let navn = "";


        /* =========================
           SUPABASE
           ========================= */

        const supabaseUrl =
            "https://ukxevteqkihqfycqjrou.supabase.co";


        const supabaseKey =
            "sb_publishable_ulauPK9fAZF8ndLKUlACxg_uvNnGtiU";


        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        /* =========================
           SPØRSMÅL
           ========================= */

        let sporsmal = [

            {
                tekst:
                    "Hva er hovedstaden i Norge?",

                svar: [
                    "Oslo",
                    "Bergen",
                    "Trondheim"
                ],

                riktig:
                    "Oslo"
            },


            {
                tekst:
                    "Hvilken planet er nærmest solen?",

                svar: [
                    "Jorden",
                    "Merkur",
                    "Mars"
                ],

                riktig:
                    "Merkur"
            },


            {
                tekst:
                    "Hvor mange dager er det i en uke?",

                svar: [
                    "5",
                    "7",
                    "10"
                ],

                riktig:
                    "7"
            },


            {
                tekst:
                    "Hvilket dyr er kjent som menneskets beste venn?",

                svar: [
                    "Katt",
                    "Hund",
                    "Hest"
                ],

                riktig:
                    "Hund"
            },


            {
                tekst:
                    "Hva heter Norges lengste elv?",

                svar: [
                    "Glomma",
                    "Drammenselva",
                    "Lågen"
                ],

                riktig:
                    "Glomma"
            }

        ];


        /* =========================
           NAVNEVALIDERING
           ========================= */

        function gyldigNavn(navnInput) {

            let navnUtenStartOgSlutt =
                navnInput.trim();


            if (
                navnUtenStartOgSlutt.length > 20
            ) {

                return false;

            }


            let deler =
                navnUtenStartOgSlutt.split(/\s+/);


            for (
                let del of deler
            ) {

                if (del.length > 10) {

                    return false;

                }

            }


            return (
                navnUtenStartOgSlutt.length > 0
            );

        }


        /* =========================
           NAVNEFELT
           ========================= */

        document
            .getElementById("navn")
            .addEventListener(
                "input",
                function() {

                    let navnInput =
                        document.getElementById(
                            "navn"
                        );


                    let startKnapp =
                        document.getElementById(
                            "startKnapp"
                        );


                    startKnapp.disabled =
                        !gyldigNavn(
                            navnInput.value
                        );

                }
            );


        /* =========================
           START KONKURRANSE
           ========================= */

        function startKonkurranse() {

            let navnInput =
                document
                    .getElementById("navn")
                    .value
                    .trim();


            if (
                !gyldigNavn(navnInput)
            ) {

                return;

            }


            navn =
                navnInput;


            poeng = 0;

            sporsmalNummer = 0;


            document
                .getElementById("poeng")
                .textContent =
                    poeng;


            document
                .getElementById("spiller")
                .textContent =
                    navn;


            document
                .getElementById("startside")
                .style.display =
                    "none";


            document
                .getElementById("toppFemBoks")
                .style.display =
                    "none";


            document
                .getElementById("quiz")
                .style.display =
                    "block";


            document
                .getElementById("spillHeader")
                .style.display =
                    "grid";


            document
                .getElementById("avbrytValg")
                .style.display =
                    "none";


            document
                .getElementById("avbrytKnapp")
                .style.display =
                    "block";


            visSporsmal();

        }


        /* =========================
           BLAND SVAR
           ========================= */

        function blandSvar(svar) {

            return svar.sort(
                () => Math.random() - 0.5
            );

        }


        /* =========================
           VIS SPØRSMÅL
           ========================= */

        function visSporsmal() {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            document
                .getElementById("sporsmalTeller")
                .textContent =
                    "Spørsmål " +
                    (sporsmalNummer + 1) +
                    " av " +
                    sporsmal.length;


            document
                .getElementById("sporsmal")
                .textContent =
                    aktueltSporsmal.tekst;


            let svaralternativer =
                document.getElementById(
                    "svaralternativer"
                );


            svaralternativer.innerHTML =
                "";


            blandSvar(
                aktueltSporsmal.svar
            ).forEach(
                function(alternativ) {

                    let knapp =
                        document.createElement(
                            "button"
                        );


                    knapp.textContent =
                        alternativ;


                    knapp.onclick =
                        function() {

                            svar(
                                alternativ,
                                knapp
                            );

                        };


                    svaralternativer
                        .appendChild(knapp);

                }
            );


            document
                .getElementById("neste")
                .style.display =
                    "none";


            /* LUKK AVBRYT-MENYEN */

            document
                .getElementById("avbrytValg")
                .style.display =
                    "none";


            document
                .getElementById("avbrytKnapp")
                .style.display =
                    "block";

        }


        /* =========================
           SVAR
           ========================= */

        function svar(
            valg,
            klikketKnapp
        ) {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            let knapper =
                document.querySelectorAll(
                    "#svaralternativer button"
                );


            knapper.forEach(
                function(knapp) {

                    knapp.disabled =
                        true;

                }
            );


            if (
                valg ===
                aktueltSporsmal.riktig
            ) {

                poeng++;


                document
                    .getElementById("poeng")
                    .textContent =
                        poeng;


                klikketKnapp.classList.add(
                    "riktig"
                );

            } else {

                klikketKnapp.classList.add(
                    "feil"
                );

            }


            document
                .getElementById("neste")
                .style.display =
                    "block";

        }


        /* =========================
           AVBRYT-MENY
           ========================= */

        function visAvbrytValg() {

            let valg =
                document.getElementById(
                    "avbrytValg"
                );


            let avbrytKnapp =
                document.getElementById(
                    "avbrytKnapp"
                );


            valg.style.display =
                "flex";


            avbrytKnapp.style.display =
                "none";

        }


        /* =========================
           START PÅ NYTT
           ========================= */

        function startPaNytt() {

            location.reload();

        }


        /* =========================
           LEVER INN SVAR
           ========================= */

        async function leverInnSvar() {

            await avsluttKonkurranse();

        }


        /* =========================
           AVSLUTT KONKURRANSE
           ========================= */

        async function avsluttKonkurranse() {

            /* SKJUL HEADER */

            document
                .getElementById("spillHeader")
                .style.display =
                    "none";


            /* SKJUL SPØRSMÅL */

            document
                .getElementById("sporsmal")
                .style.display =
                    "none";


            document
                .getElementById("sporsmalTeller")
                .style.display =
                    "none";


            /* FJERN SVARALTERNATIVER */

            document
                .getElementById(
                    "svaralternativer"
                )
                .innerHTML =
                    "";


            /* SKJUL NESTE */

            document
                .getElementById("neste")
                .style.display =
                    "none";


            /* SKJUL AVBRYT-OMRÅDE */

            document
                .getElementById("avbrytOmrade")
                .style.display =
                    "none";


            /* VIS RESULTAT */

            let sluttresultat =
                document.getElementById(
                    "sluttresultat"
                );


            sluttresultat.textContent =
                navn +
                ", du fikk " +
                poeng +
                " av " +
                sporsmal.length +
                " poeng!";


            sluttresultat.style.display =
                "block";


            /* VIS SPILL IGJEN */

            document
                .getElementById("spillIgjen")
                .style.display =
                    "block";


            /* LAGRE RESULTAT */

            let { error } =
                await supabaseClient
                    .from("Resultater")
                    .insert({
                        navn: navn,
                        poeng: poeng
                    });


            if (error) {

                console.error(
                    "Feil ved lagring:",
                    error
                );

            } else {

                /* VIS RESULTATLISTE */

                document
                    .getElementById(
                        "resultatlisteBoks"
                    )
                    .style.display =
                        "block";


                await visResultatliste();

            }

        }


        /* =========================
           NESTE SPØRSMÅL
           ========================= */

        async function nesteSporsmal() {

            sporsmalNummer++;


            if (
                sporsmalNummer <
                sporsmal.length
            ) {

                visSporsmal();

            } else {

                await avsluttKonkurranse();

            }

        }


        /* =========================
           RESULTATLISTE
           ========================= */

        async function visResultatliste() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng, created_at"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    );


            let resultatliste =
                document.getElementById(
                    "resultatliste"
                );


            resultatliste.innerHTML =
                "<h3>🏆 Resultatliste</h3>";


            if (error) {

                resultatliste.innerHTML +=
                    "<p>Kunne ikke hente resultatlisten.</p>";


                console.error(
                    "Feil ved henting av resultater:",
                    error
                );


                return;

            }


            data.forEach(
                function(resultat, index) {

                    let rad =
                        document.createElement(
                            "div"
                        );


                    rad.className =
                        "resultatrad";


                    let plassering =
                        document.createElement(
                            "span"
                        );


                    plassering.className =
                        "resultatPlassering";


                    plassering.textContent =
                        (index + 1) + ".";


                    let navnElement =
                        document.createElement(
                            "span"
                        );


                    navnElement.className =
                        "resultatNavn";


                    navnElement.textContent =
                        resultat.navn;


                    let poengElement =
                        document.createElement(
                            "span"
                        );


                    poengElement.className =
                        "resultatPoeng";


                    let dato =
                        new Date(
                            resultat.created_at
                        );


                    let datoFormatert =
                        dato.toLocaleDateString(
                            "no-NO"
                        );


                    poengElement.textContent =
                        resultat.poeng +
                        "p, " +
                        datoFormatert;


                    rad.appendChild(
                        plassering
                    );


                    rad.appendChild(
                        navnElement
                    );


                    rad.appendChild(
                        poengElement
                    );


                    resultatliste
                        .appendChild(rad);

                }
            );

        }


        /* =========================
           TOPP 5
           ========================= */

        async function visToppFem() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    )
                    .limit(5);


            let toppFem =
                document.getElementById(
                    "toppFem"
                );


            if (error) {

                toppFem.innerHTML =
                    "<h3>Topp 5</h3>" +
                    "<p>Kunne ikke hente resultater.</p>";


                console.error(
                    "Feil ved henting av topp 5:",
                    error
                );


                return;

            }


            toppFem.innerHTML =
                "<h3>Topp 5</h3>";


            data.forEach(
                function(resultat, index) {

                    let rad =
                        document.createElement(
                            "div"
                        );


                    rad.className =
                        "toppRad";


                    let nummer =
                        document.createElement(
                            "span"
                        );


                    nummer.className =
                        "toppNummer";


                    nummer.textContent =
                        (index + 1) + ".";


                    let navnElement =
                        document.createElement(
                            "span"
                        );


                    navnElement.className =
                        "toppNavn";


                    navnElement.textContent =
                        resultat.navn;


                    let poengElement =
                        document.createElement(
                            "span"
                        );


                    poengElement.className =
                        "toppPoeng";


                    poengElement.textContent =
                        resultat.poeng +
                        " poeng";


                    rad.appendChild(
                        nummer
                    );


                    rad.appendChild(
                        navnElement
                    );


                    rad.appendChild(
                        poengElement
                    );


                    toppFem.appendChild(
                        rad
                    );

                }
            );

        }


        /* =========================
           HENT TOPP 5 VED OPPSTART
           ========================= */

        visToppFem();

    </script>

</body>
</html>
