<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Konkurransen</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        .konkurranse {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🏆 Konkurransen</h1>

    <p>Velkommen!</p>

   <div class="konkurranse" id="quiz">
    <h2>Ukens konkurranse</h2>
<p>Poeng: <span id="poeng">0</span></p>
       
   <p id="sporsmal">Hva er hovedstaden i Norge?</p>

<div id="svaralternativer">
    <button onclick="svar('Oslo')">Oslo</button>
    <button onclick="svar('Bergen')">Bergen</button>
    <button onclick="svar('Trondheim')">Trondheim</button>
</div>

<p id="resultat"></p>

<button id="neste" onclick="nesteSporsmal()" style="display:none;">
    Neste spørsmål
</button>
</div>
    
<script>
    let poeng = 0;
    let sporsmalNummer = 1;

  function svar(valg) {
    const resultat = document.getElementById("resultat");

    let riktigSvar;

    if (sporsmalNummer === 1) {
        riktigSvar = "Oslo";
    } else if (sporsmalNummer === 2) {
        riktigSvar = "Merkur";
    }

    if (valg === riktigSvar) {
        poeng++;
        document.getElementById("poeng").textContent = poeng;
        resultat.textContent = "✅ Riktig svar!";
    } else {
        resultat.textContent = "❌ Feil svar!";
    }

    // Deaktiver alle svaralternativene
    const knapper = document.querySelectorAll("#svaralternativer button");

    knapper.forEach(function(knapp) {
        knapp.disabled = true;
    });

    // Vis Neste-spørsmål
    document.getElementById("neste").style.display = "inline-block";
}
}

    function nesteSporsmal() {

        if (sporsmalNummer === 1) {

            sporsmalNummer = 2;

            document.getElementById("sporsmal").textContent =
                "Hvilken planet er nærmest solen?";

            document.getElementById("svaralternativer").innerHTML = `
                <button onclick="svar('Jorden')">Jorden</button>
                <button onclick="svar('Merkur')">Merkur</button>
                <button onclick="svar('Mars')">Mars</button>
            `;

            document.getElementById("resultat").textContent = "";
            document.getElementById("neste").style.display = "none";
        }
    }
</script>
    
</body>
</html>
