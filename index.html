<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Har vi det gøy nå?</title>

    <style>

        /* =========================
           VANLIG MODUS
           ========================= */

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #F3B562;
            color: #5C4B51;
            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }


        /* =========================
           DARK MODE TOGGLE
           ========================= */

        #darkModeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 64px;
            height: 34px;

            margin: 0;
            padding: 0;

            border: 2px solid #5C4B51;
            border-radius: 20px;

            background-color: #F2EBBF;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }


        #darkModeToggle:hover {
            transform: none;
        }


        #toggleKnapp {
            position: absolute;

            width: 26px;
            height: 26px;

            left: 3px;
            top: 2px;

            margin: 0;

            padding: 0;

            border: none;
            border-radius: 50%;

            background-color: #F3B562;

            pointer-events: none;

            transition:
                left 0.2s ease,
                background-color 0.2s ease;
        }


        #toggleIkon {
            position: absolute;

            top: 50%;
            right: 6px;

            transform: translateY(-50%);

            font-size: 15px;

            pointer-events: none;
        }


        /* =========================
           HOVEDBOKSER
           ========================= */

        .konkurranse {
            border: 1px solid #5C4B51;
            border-radius: 16px;
            padding: 30px;
            margin-top: 25px;
            background-color: #F2EBBF;
            box-shadow: 0 4px 15px rgba(92, 75, 81, 0.15);

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           STARTDEL
           ========================= */

        #startside {
            border: none;
            border-radius: 0;
            padding: 20px;
            margin-top: 0;
            background-color: transparent;
            box-shadow: none;
        }


        /* =========================
           TOPP 5-BOKS
           ========================= */

        .listeboks {
            border: 1px solid #5C4B51;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            background-color: #F2EBBF;
            box-shadow: 0 4px 15px rgba(92, 75, 81, 0.15);

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =========================
           NAVNEFELT
           ========================= */

        input {
            padding: 13px;
            font-size: 18px;
            width: 250px;
            margin: 10px;

            border: 1px solid #5C4B51;
            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            color: #5C4B51;
            background-color: white;

            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        input::placeholder {
            color: #5C4B51;
            opacity: 0.7;
        }


        /* =========================
           KNAPPER
           ========================= */

        button {
            padding: 12px 24px;

            font-size: 18px;

            cursor: pointer;

            margin: 5px;

            border: 1px solid #5C4B51;
            border-radius: 8px;

            background-color: white;
            color: #5C4B51;

            transition:
                transform 0.15s ease,
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }


        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        /* =========================
           STARTKNAPP
           ========================= */

        #startKnapp {
            min-width: 150px;

            padding: 14px 28px;

            background-color: #ccc;

            color: white;

            border-color: #ccc;

            font-size: 19px;
            font-weight: bold;
        }


        #startKnapp:not(:disabled) {
            background-color: #2e9d50;
            border-color: #2e9d50;

            color: white;

            cursor: pointer;
        }


        /* =========================
           TOPP 5
           ========================= */

        #toppFem {
            width: 100%;
            text-align: center;
            color: #5C4B51;
        }


        #toppFem h3 {
            text-align: center;

            margin: 0 0 25px 0;

            font-size: 24px;

            color: #5C4B51;
        }


        .toppRad {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin: 0 auto 14px auto;

            padding: 10px 5px;
        }


        .toppRad:last-child {
            margin-bottom: 0;
        }


        .toppNummer {
            font-size: 20px;

            font-weight: bold;

            min-width: 30px;
        }


        .toppNavn {
            font-size: 19px;

            font-weight: bold;
        }


        .toppPoeng {
            font-size: 15px;

            opacity: 0.7;
        }


        /* =========================
           QUIZ
           ========================= */

        #spiller {
            font-weight: bold;
        }


        #poengVisning {
            font-size: 20px;

            font-weight: bold;

            margin: 20px 0 10px 0;

            color: #5C4B51;
        }


        #sporsmal {
            font-size: 28px;

            font-weight: bold;

            margin: 30px 0 12px 0;

            color: #5C4B51;

            line-height: 1.3;
        }


        #sporsmalTeller {
            font-size: 16px;

            color: #5C4B51;

            opacity: 0.7;

            margin-bottom: 20px;
        }


        /* =========================
           SVARALTERNATIVER
           ========================= */

        #svaralternativer {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            margin-top: 20px;
        }


        #svaralternativer button {
            width: 280px;

            min-height: 55px;

            font-size: 20px;

            border-radius: 10px;
        }


        /* RIKTIG */

        #svaralternativer button.riktig {
            background-color: #2e9d50;

            color: white;

            border-color: #2e9d50;
        }


        /* FEIL */

        #svaralternativer button.feil {
            background-color: #d64545;

            color: white;

            border-color: #d64545;
        }


        /* =========================
           NESTE
           ========================= */

        #neste {
            display: block;

            min-width: 150px;

            margin: 18px auto 0 auto;

            padding: 14px 28px;

            background-color: #2e9d50;

            border-color: #2e9d50;

            color: white;

            font-size: 19px;

            font-weight: bold;
        }


        /* =========================
           SLUTTRESULTAT
           ========================= */

        #sluttresultat {
            font-size: 24px;

            font-weight: bold;

            line-height: 1.5;

            margin: 30px 0 20px 0;

            color: #5C4B51;
        }


        /* =========================
           SPILL IGJEN
           ========================= */

        #spillIgjen {
            display: block;

            min-width: 170px;

            margin: 0 auto;

            padding: 13px 24px;

            background-color: white;

            color: #5C4B51;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           RESULTATLISTE
           ========================= */

        #resultatlisteBoks {
            border: none;

            border-radius: 0;

            padding: 10px 0 0 0;

            margin-top: 30px;

            background-color: transparent;

            box-shadow: none;
        }


        #resultatliste {
            width: 100%;

            text-align: center;

            color: #5C4B51;
        }


        #resultatliste h3 {
            text-align: center;

            margin: 0 0 25px 0;

            font-size: 24px;

            color: #5C4B51;
        }


        .resultatrad {
            width: 100%;

            text-align: center;

            margin: 0 auto 20px auto;

            padding-bottom: 0;

            border-bottom: none;

            color: #5C4B51;
        }


        .resultatrad:last-child {
            margin-bottom: 0;
        }


        .resultatrad strong {
            display: block;

            width: 100%;

            text-align: center;

            font-size: 19px;

            color: #5C4B51;
        }


        .resultatdato {
            display: block;

            width: 100%;

            text-align: center;

            font-size: 14px;

            color: #5C4B51;

            opacity: 0.7;

            margin-top: 5px;
        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        body.dark-mode {
            background-color: #263238;

            color: #8CBEB2;
        }


        /* TOGGLE */

        body.dark-mode #darkModeToggle {
            background-color: #37474F;

            border-color: #8CBEB2;
        }


        body.dark-mode #toggleKnapp {
            left: 33px;

            background-color: #8CBEB2;
        }


        body.dark-mode #toggleIkon {
            left: 7px;

            right: auto;
        }


        /* HOVEDBOKSER */

        body.dark-mode .konkurranse {
            background-color: #37474F;

            border-color: #8CBEB2;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.35);
        }


        /* STARTDEL */

        body.dark-mode #startside {
            background-color: transparent;

            border: none;

            box-shadow: none;
        }


        /* TOPP 5-BOKS */

        body.dark-mode .listeboks {
            background-color: #37474F;

            border-color: #8CBEB2;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.35);
        }


        /* INPUT */

        body.dark-mode input {
            background-color: #263238;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode input::placeholder {
            color: #8CBEB2;

            opacity: 0.7;
        }


        /* VANLIGE KNAPPER */

        body.dark-mode button {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        /* STARTKNAPP */

        body.dark-mode #startKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #455A64;
        }


        body.dark-mode #startKnapp:not(:disabled) {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        /* TOPP 5 */

        body.dark-mode #toppFem {
            color: #8CBEB2;
        }


        body.dark-mode #toppFem h3 {
            color: #8CBEB2;
        }


        body.dark-mode .toppNummer {
            color: #8CBEB2;
        }


        body.dark-mode .toppNavn {
            color: #8CBEB2;
        }


        body.dark-mode .toppPoeng {
            color: #8CBEB2;
        }


        /* QUIZ */

        body.dark-mode #poengVisning {
            color: #8CBEB2;
        }


        body.dark-mode #sporsmal {
            color: #8CBEB2;
        }


        body.dark-mode #sporsmalTeller {
            color: #8CBEB2;
        }


        body.dark-mode #spiller {
            color: #8CBEB2;
        }


        /* RIKTIG SVAR */

        body.dark-mode #svaralternativer button.riktig {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        /* FEIL SVAR */

        body.dark-mode #svaralternativer button.feil {
            background-color: #A94A4A;

            color: #F2EBBF;

            border-color: #A94A4A;
        }


        /* NESTE */

        body.dark-mode #neste {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        /* SLUTTRESULTAT */

        body.dark-mode #sluttresultat {
            color: #8CBEB2;
        }


        /* SPILL IGJEN */

        body.dark-mode #spillIgjen {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        /* RESULTATLISTE */

        body.dark-mode #resultatliste {
            color: #8CBEB2;
        }


        body.dark-mode #resultatliste h3 {
            color: #8CBEB2;
        }


        body.dark-mode .resultatrad {
            color: #8CBEB2;
        }


        body.dark-mode .resultatrad strong {
            color: #8CBEB2;
        }


        body.dark-mode .resultatdato {
            color: #8CBEB2;
        }


        /* =========================
           MOBIL
           ========================= */

        @media (max-width: 600px) {

            body {
                margin: 10px auto;

                padding: 12px;
            }


            #darkModeToggle {
                top: 12px;

                right: 12px;
            }


            .konkurranse {
                padding: 20px 15px;

                margin-top: 15px;
            }


            #startside {
                padding: 15px 5px;
            }


            .listeboks {
                padding: 20px 15px;

                margin-top: 15px;
            }


            input {
                width: 80%;

                max-width: 300px;

                text-align: center;
            }


            #svaralternativer button {
                width: 100%;

                max-width: 320px;

                min-height: 60px;
            }


            #sporsmal {
                font-size: 24px;

                margin: 25px 0 10px 0;
            }


            #poengVisning {
                font-size: 19px;
            }


            #toppFem h3,
            #resultatliste h3 {
                font-size: 22px;
            }


            .toppRad {
                gap: 8px;
            }


            .toppNavn {
                font-size: 18px;
            }


            .toppPoeng {
                font-size: 14px;
            }


            #sluttresultat {
                font-size: 21px;
            }

        }

    </style>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =========================
         DARK MODE TOGGLE
         ========================= -->

    <button
        id="darkModeToggle"
        onclick="toggleDarkMode()"
        aria-label="Bytt mellom lys og mørk modus"
    >

        <span id="toggleKnapp"></span>

        <span id="toggleIkon">☀️</span>

    </button>


    <!-- =========================
         FORSIDE
         ========================= -->

    <div id="startside" class="konkurranse">

        <p>
            Skriv inn navnet ditt, og klikk start.
        </p>


        <input
            type="text"
            id="navn"
            placeholder="Ditt navn"
            autocomplete="off"
        >


        <br>


        <button
            id="startKnapp"
            onclick="startKonkurranse()"
            disabled
        >
            Start
        </button>

    </div>


    <!-- =========================
         TOPP 5
         ========================= -->

    <div id="toppFemBoks" class="listeboks">

        <div id="toppFem">

            <h3>Topp 5</h3>

            <p>
                Laster resultater...
            </p>

        </div>

    </div>


    <!-- =========================
         QUIZ
         ========================= -->

    <div
        id="quiz"
        class="konkurranse"
        style="display: none;"
    >

        <p>
            Spiller:
            <strong id="spiller"></strong>
        </p>


        <p id="poengVisning">
            ⭐ Poeng:
            <span id="poeng">0</span>
        </p>


        <p id="sporsmal"></p>


        <p id="sporsmalTeller"></p>


        <div id="svaralternativer"></div>


        <!-- SLUTTRESULTAT -->

        <div
            id="sluttresultat"
            style="display: none;"
        ></div>


        <!-- SPILL IGJEN -->

        <button
            id="spillIgjen"
            style="display: none;"
            onclick="location.reload()"
        >
            🔄 Spill igjen
        </button>


        <!-- RESULTATLISTE -->

        <div
            id="resultatlisteBoks"
            style="display: none;"
        >

            <div id="resultatliste"></div>

        </div>


        <!-- NESTE -->

        <button
            id="neste"
            onclick="nesteSporsmal()"
            style="display: none;"
        >
            Neste ➡️
        </button>

    </div>


    <script>

        /* =========================
           DARK MODE
           ========================= */

        function toggleDarkMode() {

            document
                .body
                .classList
                .toggle("dark-mode");


            let erDarkMode =
                document
                    .body
                    .classList
                    .contains("dark-mode");


            let ikon =
                document.getElementById(
                    "toggleIkon"
                );


            if (erDarkMode) {

                ikon.textContent = "🌙";

            } else {

                ikon.textContent = "☀️";

            }

        }


        /* =========================
           VARIABLER
           ========================= */

        let poeng = 0;

        let sporsmalNummer = 0;

        let navn = "";


        /* =========================
           SUPABASE
           ========================= */

        const supabaseUrl =
            "https://ukxevteqkihqfycqjrou.supabase.co";


        const supabaseKey =
            "sb_publishable_ulauPK9fAZF8ndLKUlACxg_uvNnGtiU";


        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        /* =========================
           SPØRSMÅL
           ========================= */

        let sporsmal = [

            {
                tekst: "Hva er hovedstaden i Norge?",

                svar: [
                    "Oslo",
                    "Bergen",
                    "Trondheim"
                ],

                riktig: "Oslo"
            },


            {
                tekst: "Hvilken planet er nærmest solen?",

                svar: [
                    "Jorden",
                    "Merkur",
                    "Mars"
                ],

                riktig: "Merkur"
            },


            {
                tekst: "Hvor mange dager er det i en uke?",

                svar: [
                    "5",
                    "7",
                    "10"
                ],

                riktig: "7"
            },


            {
                tekst: "Hvilket dyr er kjent som menneskets beste venn?",

                svar: [
                    "Katt",
                    "Hund",
                    "Hest"
                ],

                riktig: "Hund"
            },


            {
                tekst: "Hva heter Norges lengste elv?",

                svar: [
                    "Glomma",
                    "Drammenselva",
                    "Lågen"
                ],

                riktig: "Glomma"
            }

        ];


        /* =========================
           STARTKNAPP
           ========================= */

        document
            .getElementById("navn")
            .addEventListener(
                "input",
                function() {

                    let navnInput =
                        document.getElementById(
                            "navn"
                        );


                    let startKnapp =
                        document.getElementById(
                            "startKnapp"
                        );


                    if (
                        navnInput.value.trim() === ""
                    ) {

                        startKnapp.disabled = true;

                    } else {

                        startKnapp.disabled = false;

                    }

                }
            );


        /* =========================
           START KONKURRANSE
           ========================= */

        function startKonkurranse() {

            navn =
                document
                    .getElementById("navn")
                    .value
                    .trim();


            document
                .getElementById("spiller")
                .textContent =
                    navn;


            document
                .getElementById("startside")
                .style.display =
                    "none";


            document
                .getElementById("toppFemBoks")
                .style.display =
                    "none";


            document
                .getElementById("quiz")
                .style.display =
                    "block";


            visSporsmal();

        }


        /* =========================
           BLAND SVAR
           ========================= */

        function blandSvar(svar) {

            return svar.sort(
                () => Math.random() - 0.5
            );

        }


        /* =========================
           VIS SPØRSMÅL
           ========================= */

        function visSporsmal() {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            document
                .getElementById("sporsmalTeller")
                .textContent =
                    "Spørsmål " +
                    (sporsmalNummer + 1) +
                    " av " +
                    sporsmal.length;


            document
                .getElementById("sporsmal")
                .textContent =
                    aktueltSporsmal.tekst;


            let svaralternativer =
                document.getElementById(
                    "svaralternativer"
                );


            svaralternativer.innerHTML =
                "";


            blandSvar(
                aktueltSporsmal.svar
            ).forEach(
                function(alternativ) {

                    let knapp =
                        document.createElement(
                            "button"
                        );


                    knapp.textContent =
                        alternativ;


                    knapp.onclick =
                        function() {

                            svar(
                                alternativ,
                                knapp
                            );

                        };


                    svaralternativer
                        .appendChild(knapp);

                }
            );


            document
                .getElementById("neste")
                .style.display =
                    "none";

        }


        /* =========================
           SVAR
           ========================= */

        function svar(
            valg,
            klikketKnapp
        ) {

            let aktueltSporsmal =
                sporsmal[sporsmalNummer];


            let knapper =
                document.querySelectorAll(
                    "#svaralternativer button"
                );


            knapper.forEach(
                function(knapp) {

                    knapp.disabled = true;

                }
            );


            if (
                valg ===
                aktueltSporsmal.riktig
            ) {

                poeng++;


                document
                    .getElementById("poeng")
                    .textContent =
                        poeng;


                klikketKnapp.classList.add(
                    "riktig"
                );

            } else {

                klikketKnapp.classList.add(
                    "feil"
                );

            }


            document
                .getElementById("neste")
                .style.display =
                    "block";

        }


        /* =========================
           NESTE SPØRSMÅL
           ========================= */

        async function nesteSporsmal() {

            sporsmalNummer++;


            if (
                sporsmalNummer <
                sporsmal.length
            ) {

                visSporsmal();

            } else {

                /* SKJUL QUIZINNHOLD */

                document
                    .getElementById("sporsmal")
                    .style.display =
                        "none";


                document
                    .getElementById("sporsmalTeller")
                    .style.display =
                        "none";


                document
                    .getElementById("poengVisning")
                    .style.display =
                        "none";


                document
                    .getElementById(
                        "svaralternativer"
                    )
                    .innerHTML =
                        "";


                document
                    .getElementById("neste")
                    .style.display =
                        "none";


                /* VIS RESULTAT */

                let sluttresultat =
                    document.getElementById(
                        "sluttresultat"
                    );


                sluttresultat.textContent =
                    navn +
                    ", du fikk " +
                    poeng +
                    " av " +
                    sporsmal.length +
                    " poeng!";


                sluttresultat.style.display =
                    "block";


                /* VIS SPILL IGJEN */

                document
                    .getElementById("spillIgjen")
                    .style.display =
                        "block";


                /* LAGRE RESULTAT */

                let { error } =
                    await supabaseClient
                        .from("Resultater")
                        .insert({
                            navn: navn,
                            poeng: poeng
                        });


                if (error) {

                    console.error(
                        "Feil ved lagring:",
                        error
                    );

                } else {

                    /* VIS RESULTATLISTE */

                    document
                        .getElementById(
                            "resultatlisteBoks"
                        )
                        .style.display =
                            "block";


                    await visResultatliste();

                }

            }

        }


        /* =========================
           RESULTATLISTE
           ========================= */

        async function visResultatliste() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng, created_at"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    );


            let resultatliste =
                document.getElementById(
                    "resultatliste"
                );


            resultatliste.innerHTML =
                "<h3>🏆 Resultatliste</h3>";


            if (error) {

                resultatliste.innerHTML +=
                    "<p>Kunne ikke hente resultatlisten.</p>";


                console.error(
                    "Feil ved henting av resultater:",
                    error
                );


                return;

            }


            data.forEach(
                function(resultat) {

                    let rad =
                        document.createElement(
                            "div"
                        );


                    rad.className =
                        "resultatrad";


                    let dato =
                        new Date(
                            resultat.created_at
                        );


                    let datoFormatert =
                        dato.toLocaleDateString(
                            "no-NO"
                        );


                    rad.innerHTML =
                        "<strong>" +
                        resultat.navn +
                        "</strong>" +

                        '<div class="resultatdato">' +

                        resultat.poeng +
                        "p, " +
                        datoFormatert +

                        "</div>";


                    resultatliste
                        .appendChild(rad);

                }
            );

        }


        /* =========================
           TOPP 5
           ========================= */

        async function visToppFem() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng"
                    )
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    )
                    .limit(5);


            let toppFem =
                document.getElementById(
                    "toppFem"
                );


            if (error) {

                toppFem.innerHTML =
                    "<h3>Topp 5</h3>" +
                    "<p>Kunne ikke hente resultater.</p>";


                console.error(
                    "Feil ved henting av topp 5:",
                    error
                );


                return;

            }


            toppFem.innerHTML =
                "<h3>Topp 5</h3>";


            data.forEach(
                function(resultat, index) {

                    let rad =
                        document.createElement(
                            "div"
                        );


                    rad.className =
                        "toppRad";


                    let nummer =
                        document.createElement(
                            "span"
                        );


                    nummer.className =
                        "toppNummer";


                    nummer.textContent =
                        (index + 1) + ".";


                    let navnElement =
                        document.createElement(
                            "span"
                        );


                    navnElement.className =
                        "toppNavn";


                    navnElement.textContent =
                        resultat.navn;


                    let poengElement =
                        document.createElement(
                            "span"
                        );


                    poengElement.className =
                        "toppPoeng";


                    poengElement.textContent =
                        resultat.poeng +
                        " poeng";


                    rad.appendChild(
                        nummer
                    );


                    rad.appendChild(
                        navnElement
                    );


                    rad.appendChild(
                        poengElement
                    );


                    toppFem.appendChild(
                        rad
                    );

                }
            );

        }


        /* =========================
           HENT TOPP 5 VED OPPSTART
           ========================= */

        visToppFem();

    </script>
