<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Har vi det gøy nå?</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #f7f7f7;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .konkurranse {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        input {
            padding: 12px;
            font-size: 18px;
            width: 250px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #svaralternativer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }

        #svaralternativer button {
            width: 280px;
            min-height: 55px;
            font-size: 20px;
            border-radius: 10px;
        }

        #sporsmal {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
        }

        #sporsmalTeller {
            font-size: 16px;
            color: #666;
        }

        #poengVisning {
            font-size: 20px;
            font-weight: bold;
        }

        #resultat {
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }

        #resultatliste {
            margin-top: 30px;
        }

        @media (max-width: 600px) {

            body {
                margin: 10px auto;
                padding: 15px;
            }

            h1 {
                font-size: 32px;
            }

            .konkurranse {
                padding: 20px;
                margin-top: 20px;
            }

            input {
                width: 80%;
                max-width: 300px;
            }

            #svaralternativer button {
                width: 100%;
                max-width: 320px;
                min-height: 60px;
            }

            #sporsmal {
                font-size: 24px;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>🏆 Konkurransen</h1>

    <div id="startside" class="konkurranse">

        <h2>Velkommen!</h2>

        <p>Skriv inn navnet ditt, og klikk start.</p>

        <input
            type="text"
            id="navn"
            placeholder="Ditt navn"
        >

        <br>

        <button onclick="startKonkurranse()">
            Start
        </button>

    </div>


    <div id="quiz" class="konkurranse" style="display: none;">

        <p>Spiller: <strong id="spiller"></strong></p>

        <p id="poengVisning">
            ⭐ Poeng: <span id="poeng">0</span>
        </p>

        <p id="sporsmal"></p>

        <p id="sporsmalTeller"></p>

        <div id="svaralternativer"></div>

        <p id="resultat"></p>

        <div id="resultatliste"></div>

        <button
            id="neste"
            onclick="nesteSporsmal()"
            style="display: none;"
        >
            Neste ➡️
        </button>

    </div>


    <script>

        let poeng = 0;
        let sporsmalNummer = 0;
        let navn = "";


        const supabaseUrl =
            "https://ukxevteqkihqfycqjrou.supabase.co";

        const supabaseKey =
            "sb_publishable_ulauPK9fAZF8ndLKUlACxg_uvNnGtiU";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        let sporsmal = [
            {
                tekst: "Hva er hovedstaden i Norge?",
                svar: ["Oslo", "Bergen", "Trondheim"],
                riktig: "Oslo"
            },
            {
                tekst: "Hvilken planet er nærmest solen?",
                svar: ["Jorden", "Merkur", "Mars"],
                riktig: "Merkur"
            },
            {
                tekst: "Hvor mange dager er det i en uke?",
                svar: ["5", "7", "10"],
                riktig: "7"
            },
            {
                tekst: "Hvilket dyr er kjent som menneskets beste venn?",
                svar: ["Katt", "Hund", "Hest"],
                riktig: "Hund"
            },
            {
                tekst: "Hva heter Norges lengste elv?",
                svar: ["Glomma", "Drammenselva", "Lågen"],
                riktig: "Glomma"
            }
        ];


        function startKonkurranse() {

            navn = document.getElementById("navn").value;

            if (navn === "") {
                alert("Skriv inn navnet ditt først!");
                return;
            }

            document.getElementById("spiller").textContent = navn;

            document.getElementById("startside").style.display = "none";

            document.getElementById("quiz").style.display = "block";

            visSporsmal();
        }


        function blandSvar(svar) {
            return svar.sort(() => Math.random() - 0.5);
        }


        function visSporsmal() {

            let aktueltSporsmal = sporsmal[sporsmalNummer];

            document.getElementById("sporsmalTeller").textContent =
                "Spørsmål " + (sporsmalNummer + 1) + " av " + sporsmal.length;

            document.getElementById("sporsmal").textContent =
                aktueltSporsmal.tekst;

            let svaralternativer =
                document.getElementById("svaralternativer");

            svaralternativer.innerHTML = "";

            blandSvar(aktueltSporsmal.svar).forEach(function(alternativ) {

                let knapp = document.createElement("button");

                knapp.textContent = alternativ;

                knapp.onclick = function() {
                    svar(alternativ);
                };

                svaralternativer.appendChild(knapp);

            });

            document.getElementById("resultat").textContent = "";

            document.getElementById("neste").style.display = "none";
        }


        function svar(valg) {

            let aktueltSporsmal = sporsmal[sporsmalNummer];

            let resultat =
                document.getElementById("resultat");

            if (valg === aktueltSporsmal.riktig) {

                poeng++;

                document.getElementById("poeng").textContent = poeng;

                resultat.textContent = "✅ Riktig svar!";

            } else {

                resultat.textContent = "❌ Feil svar!";

            }


            let knapper =
                document.querySelectorAll(
                    "#svaralternativer button"
                );

            knapper.forEach(function(knapp) {
                knapp.disabled = true;
            });


            document.getElementById("neste").style.display =
                "inline-block";
        }


        async function nesteSporsmal() {

            sporsmalNummer++;

            if (sporsmalNummer < sporsmal.length) {

                visSporsmal();

            } else {

                document.getElementById("sporsmal").textContent =
                    "🎉 Konkurransen er ferdig!";

                document.getElementById("svaralternativer").innerHTML = "";

                document.getElementById("resultat").textContent =
                    navn + ", du fikk " + poeng + " av " + sporsmal.length + " poeng!";

                document.getElementById("neste").style.display = "none";


                let { error } = await supabaseClient
                    .from("Resultater")
                    .insert({
                        navn: navn,
                        poeng: poeng
                    });


                if (error) {

                    console.error("Feil ved lagring:", error);

                    document.getElementById("resultat").textContent +=
                        " ⚠️ Resultatet kunne ikke lagres.";

                } else {

                    await visResultatliste();

                }


                let spillIgjen =
                    document.createElement("button");

                spillIgjen.textContent =
                    "🔄 Spill igjen";

                spillIgjen.onclick = function() {
                    location.reload();
                };

                document
                    .getElementById("svaralternativer")
                    .appendChild(spillIgjen);
            }
        }


        async function visResultatliste() {

            let { data, error } =
                await supabaseClient
                    .from("Resultater")
                    .select("navn, poeng")
                    .order("poeng", { ascending: false });


            let resultatliste =
                document.getElementById("resultatliste");

            resultatliste.innerHTML =
                "<h3>🏆 Resultatliste</h3>";


            if (error) {

                resultatliste.innerHTML +=
                    "<p>Kunne ikke hente resultatlisten.</p>";

                console.error(
                    "Feil ved henting av resultater:",
                    error
                );

                return;
            }


            data.forEach(function(resultat) {

                let rad =
                    document.createElement("p");

                rad.textContent =
                    resultat.navn +
                    " – " +
                    resultat.poeng +
                    " poeng";

                resultatliste.appendChild(rad);

            });
        }


    </script>

</body>
</html>
