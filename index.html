<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Konkurransen</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        .konkurranse {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #resultat {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🏆 Konkurransen</h1>

    <p>Velkommen!</p>

    <div class="konkurranse">

        <h2>Ukens konkurranse</h2>

        <p>Poeng: <span id="poeng">0</span></p>

        <p id="sporsmal"></p>

        <div id="svaralternativer"></div>

        <p id="resultat"></p>

        <button id="neste" onclick="nesteSporsmal()" style="display: none;">
            Neste spørsmål
        </button>

    </div>

    <script>

        let poeng = 0;
        let sporsmalNummer = 0;

        let sporsmal = [
            {
                tekst: "Hva er hovedstaden i Norge?",
                svar: ["Oslo", "Bergen", "Trondheim"],
                riktig: "Oslo"
            },
            {
                tekst: "Hvilken planet er nærmest solen?",
                svar: ["Jorden", "Merkur", "Mars"],
                riktig: "Merkur"
            }
        ];


        function visSporsmal() {

            let aktueltSporsmal = sporsmal[sporsmalNummer];

            document.getElementById("sporsmal").textContent =
                aktueltSporsmal.tekst;

            let svaralternativer =
                document.getElementById("svaralternativer");

            svaralternativer.innerHTML = "";

            aktueltSporsmal.svar.forEach(function(alternativ) {

                let knapp = document.createElement("button");

                knapp.textContent = alternativ;

                knapp.onclick = function() {
                    svar(alternativ);
                };

                svaralternativer.appendChild(knapp);

            });

            document.getElementById("resultat").textContent = "";

            document.getElementById("neste").style.display = "none";
        }


        function svar(valg) {

            let aktueltSporsmal = sporsmal[sporsmalNummer];

            let resultat = document.getElementById("resultat");

            if (valg === aktueltSporsmal.riktig) {

                poeng++;

                document.getElementById("poeng").textContent = poeng;

                resultat.textContent = "✅ Riktig svar!";

            } else {

                resultat.textContent = "❌ Feil svar!";

            }


            let knapper =
                document.querySelectorAll("#svaralternativer button");

            knapper.forEach(function(knapp) {
                knapp.disabled = true;
            });


            document.getElementById("neste").style.display =
                "inline-block";
        }


        function nesteSporsmal() {

            sporsmalNummer++;

            if (sporsmalNummer < sporsmal.length) {

                visSporsmal();

            } else {

                document.getElementById("sporsmal").textContent =
                    "Konkurransen er ferdig!";

                document.getElementById("svaralternativer").innerHTML = "";

                document.getElementById("resultat").textContent =
                    "Du fikk " + poeng + " poeng!";

                document.getElementById("neste").style.display = "none";
            }
        }


        visSporsmal();

    </script>

</body>
</html>
