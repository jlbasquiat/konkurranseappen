<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizz</title>

    <style>

        /* =========================
           VANLIG MODUS
           ========================= */

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #E8DCC4;
            color: #354F52;
            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }


        /* =========================
           HEADER UNDER SPILLET
           ========================= */

        #spillHeader {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;

            z-index: 1000;

            display: block;

            pointer-events: none;
        }


        #poengVisning {
            position: absolute;

            left: 0;
            top: 0;

            margin: 0;

            font-size: 20px;
            font-weight: bold;

            color: #354F52;

            text-align: left;

            pointer-events: none;
        }


        /* =========================
           DARK MODE TOGGLE
           ========================= */

        #darkModeToggle {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 1001;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 64px;
            height: 34px;

            margin: 0;
            padding: 0;

            border: 2px solid #52706B;
            border-radius: 20px;

            background-color: #F7F3EA;

            cursor: pointer;

            pointer-events: auto;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }


        #darkModeToggle:hover {
            transform: none;
        }


        #toggleKnapp {
            position: absolute;

            width: 26px;
            height: 26px;

            left: 3px;
            top: 2px;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 50%;

            background-color: #E8DCC4;

            pointer-events: none;

            transition:
                left 0.2s ease,
                background-color 0.2s ease;
        }


        #toggleIkon {
            position: absolute;

            top: 50%;
            right: 6px;

            transform: translateY(-50%);

            font-size: 15px;

            pointer-events: none;
        }


        /* =========================
           FORSIDE
           ========================= */

        #startside {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 10px 20px 0;

            margin-top: 120px;
        }


        #startside p {
            margin: 0 0 18px;

            font-size: 20px;
            font-weight: bold;
        }


        /* =========================
           NAVNEFELT
           ========================= */

        input {
            padding: 14px;

            font-size: 18px;

            width: 280px;
            max-width: 90%;

            margin: 5px 0 12px;

            border: 1px solid #52706B;
            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            color: #354F52;
            background-color: #F7F3EA;

            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        input::placeholder {
            color: #354F52;
            opacity: 0.7;
        }


        /* =========================
           KNAPPER
           ========================= */

        button {
            padding: 12px 24px;

            font-size: 18px;

            cursor: pointer;

            margin: 5px;

            border: 1px solid #52706B;
            border-radius: 8px;

            background-color: #E6EDE9;
            color: #354F52;

            transition:
                transform 0.15s ease,
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }


        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        /* =========================
           STARTKNAPP
           ========================= */

        #startKnapp {
            min-width: 180px;

            padding: 15px 32px;

            margin-top: 2px;

            background-color: #B8C5C1;

            color: white;

            border-color: #B8C5C1;

            font-size: 20px;
            font-weight: bold;
        }


        #startKnapp:not(:disabled) {
            background-color: #4F8A78;

            border-color: #4F8A78;

            color: white;

            cursor: pointer;
        }


        /* =========================
           TOPPRESULTATER
           ========================= */

        #toppFemBoks {
            border: none;

            border-radius: 0;

            padding: 10px 0;

            margin: 45px auto 0;

            background-color: transparent;

            box-shadow: none;

            max-width: 430px;
        }


        #toppFem {
            width: 100%;
            text-align: center;

            color: #354F52;
        }


        #toppFem h3 {
            text-align: center;

            margin: 0 0 15px;

            font-size: 19px;
            font-weight: normal;

            color: #354F52;

            opacity: 0.8;
        }


        /* =========================
           TOPP-BRYTER
           ========================= */

        .topplisteBryter {
            display: flex;

            justify-content: center;
            align-items: stretch;

            margin-bottom: 18px;

            gap: 0;

            border: 1px solid #52706B;

            border-radius: 18px;

            overflow: hidden;

            width: fit-content;

            margin-left: auto;
            margin-right: auto;
        }


        .periodeKnapp {
            border: none;

            border-radius: 0;

            margin: 0;

            padding: 8px 20px;

            font-size: 14px;

            font-weight: normal;

            background-color: transparent;

            color: #354F52;

            opacity: 0.65;

            box-shadow: none;

            min-width: 80px;
        }


        .periodeKnapp:hover {
            transform: none;

            background-color: transparent;
        }


        .periodeKnapp.aktiv {
            background-color: #52706B;

            color: white;

            opacity: 1;

            font-weight: bold;
        }


        /* =========================
           TOPP 3-RADER
           ========================= */

        .toppRad {
            display: grid;

            grid-template-columns: 40px 180px 70px;

            align-items: center;

            width: 290px;

            margin: 0 auto 9px;

            padding: 5px 0;
        }


        .toppRad:last-child {
            margin-bottom: 0;
        }


        .toppNummer {
            text-align: left;

            font-size: 22px;

            line-height: 1;
        }


        .toppNavn {
            width: 180px;

            text-align: center;

            font-size: 15px;

            font-weight: normal;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .toppPoeng {
            text-align: right;

            font-size: 13px;

            opacity: 0.65;
        }


        .ingenResultater {
            font-size: 14px;

            opacity: 0.65;

            margin: 15px 0;
        }


        /* =========================
           FULL LISTE
           ========================= */

        .utvidetListe {
            margin-top: 0;
        }


        .utvidetRad {
            display: grid;

            grid-template-columns: 40px 180px 70px;

            align-items: center;

            width: 290px;

            margin: 0 auto 9px;

            padding: 5px 0;
        }


        .utvidetPlassering {
            text-align: left;

            font-size: 16px;

            font-weight: normal;
        }


        .utvidetNavn {
            width: 180px;

            text-align: center;

            font-size: 15px;

            font-weight: normal;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .utvidetPoeng {
            text-align: right;

            font-size: 13px;

            opacity: 0.65;
        }


        /* =========================
           FULL RESULTATLISTE-KNAPP
           ========================= */

        .fullListeKnapp {
            display: block;

            margin: 18px auto 0;

            padding: 8px 14px;

            border: none;

            background-color: transparent;

            color: #354F52;

            font-size: 14px;

            opacity: 0.75;

            box-shadow: none;
        }


        .fullListeKnapp:hover {
            transform: none;

            opacity: 1;

            background-color: transparent;
        }


        /* =========================
           QUIZ
           ========================= */

        #quiz {
            min-height: calc(100vh - 40px);

            margin-top: 0;

            padding: 105px 0 95px;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;
        }


        /* =========================
           SPØRSMÅL
           ========================= */

        #sporsmal {
            font-size: 28px;

            font-weight: bold;

            width: 100%;

            max-width: 650px;

            margin: 5px auto 15px;

            padding: 0 15px;

            box-sizing: border-box;

            color: #354F52;

            line-height: 1.3;

            text-align: center;
        }


        /* =========================
           PROGRESSBAR
           ========================= */

        #progressbar {
            position: fixed;

            top: 68px;

            left: 0;
            right: 0;

            z-index: 999;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            margin: 0;

            min-height: 16px;

            pointer-events: none;
        }


        .progressSirkel {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background-color: transparent;

            border: 2px solid #52706B;

            box-sizing: border-box;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }


        .progressSirkel.riktig {
            background-color: #4F8A78;

            border-color: #4F8A78;
        }


        .progressSirkel.feil {
            background-color: #A94A4A;

            border-color: #A94A4A;
        }


        /* =========================
           SVARALTERNATIVER
           ========================= */

        #svaralternativer {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            margin-top: 15px;
        }


        #svaralternativer button {
            width: 280px;

            min-height: 55px;

            font-size: 20px;

            border-radius: 10px;
        }


        #svaralternativer button.riktig {
            background-color: #4F8A78;

            color: white;

            border-color: #4F8A78;
        }


        #svaralternativer button.feil {
            background-color: #A94A4A;

            color: white;

            border-color: #A94A4A;
        }


        /* =========================
           NESTE
           ========================= */

        #neste {
            display: block;

            min-width: 150px;

            margin: 14px auto 0;

            padding: 12px 28px;

            background-color: #4F8A78;

            border-color: #4F8A78;

            color: white;

            font-size: 19px;

            font-weight: bold;
        }


        /* =========================
           AVBRYT-MENY
           ========================= */

        #avbrytOmrade {
            position: fixed;

            bottom: 18px;

            left: 0;
            right: 0;

            z-index: 900;

            display: flex;

            flex-direction: column;

            align-items: center;

            pointer-events: none;
        }


        #avbrytKnapp {
            min-width: 130px;

            padding: 9px 20px;

            margin: 0;

            font-size: 15px;

            background-color: #E6EDE9;

            color: #354F52;

            border-color: #52706B;

            pointer-events: auto;
        }


        #avbrytValg {
            display: none;

            flex-direction: column;

            align-items: center;

            margin-bottom: 5px;

            pointer-events: auto;
        }


        #leverInnKnapp {
            min-width: 190px;

            background-color: #4F8A78;

            color: white;

            border-color: #4F8A78;

            font-weight: bold;
        }


        #startPaNyttKnapp {
            min-width: 190px;

            background-color: #E6EDE9;

            color: #354F52;

            border-color: #52706B;

            font-weight: bold;
        }


        /* =========================
           SLUTTRESULTAT
           ========================= */

        #sluttresultat {
            font-size: 24px;

            font-weight: bold;

            line-height: 1.5;

            margin: 10px 0 20px;

            color: #354F52;
        }


        /* =========================
           RESULTATSIDE
           ========================= */

        #resultatside {
            display: none;

            padding-top: 80px;

            padding-bottom: 40px;

            text-align: center;
        }


        #resultatside h2 {
            margin: 0 0 25px;

            font-size: 28px;

            color: #354F52;
        }


        #resultatsideTopp {
            max-width: 430px;

            margin: 0 auto;
        }


        #resultatsideToppliste {
            min-height: 100px;
        }


        /* =========================
           VIS / SKJUL FULL LISTE
           ========================= */

        #visSkjulListeKnapp {
            display: block;

            margin: 22px auto 0;

            background-color: transparent;

            color: #354F52;

            border: none;

            font-size: 15px;

            opacity: 0.75;
        }


        #visSkjulListeKnapp:hover {
            transform: none;

            opacity: 1;

            background-color: transparent;
        }


        /* =========================
           RESULTATRADER
           ========================= */

        .resultatrad {
            display: grid;

            grid-template-columns: 40px 220px 90px;

            align-items: center;

            width: 350px;

            margin: 0 auto 20px;

            color: #354F52;
        }


        .resultatrad:last-child {
            margin-bottom: 0;
        }


        .resultatPlassering {
            text-align: left;

            font-size: 19px;

            font-weight: bold;
        }


        .resultatNavn {
            width: 220px;

            text-align: center;

            font-size: 19px;

            font-weight: bold;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .resultatPoeng {
            text-align: right;

            font-size: 14px;

            opacity: 0.7;
        }


        /* =========================
           SPILL IGJEN
           ========================= */

        #spillIgjen {
            display: block;

            min-width: 170px;

            margin: 0 auto;

            padding: 13px 24px;

            background-color: #E6EDE9;

            color: #354F52;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           TILBAKE TIL START
           ========================= */

        #tilbakeKnapp {
            margin-top: 30px;

            background-color: transparent;

            border: none;

            color: #354F52;

            font-size: 15px;

            opacity: 0.7;
        }


        #tilbakeKnapp:hover {
            transform: none;

            opacity: 1;

            background-color: transparent;
        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        body.dark-mode {
            background-color: #263238;

            color: #8CBEB2;
        }


        body.dark-mode #poengVisning {
            color: #8CBEB2;
        }


        body.dark-mode #darkModeToggle {
            background-color: #37474F;

            border-color: #8CBEB2;
        }


        body.dark-mode #toggleKnapp {
            left: 33px;

            background-color: #8CBEB2;
        }


        body.dark-mode #toggleIkon {
            left: 7px;

            right: auto;
        }


        body.dark-mode #toppFem,
        body.dark-mode #resultatside,
        body.dark-mode #resultatside h2,
        body.dark-mode #resultatside h3 {
            color: #8CBEB2;
        }


        body.dark-mode .topplisteBryter {
            border-color: #8CBEB2;
        }


        body.dark-mode .periodeKnapp {
            color: #8CBEB2;
        }


        body.dark-mode .periodeKnapp.aktiv {
            background-color: #8CBEB2;

            color: #263238;

            opacity: 1;

            font-weight: bold;
        }


        body.dark-mode .toppNummer,
        body.dark-mode .toppNavn,
        body.dark-mode .toppPoeng,
        body.dark-mode .utvidetPlassering,
        body.dark-mode .utvidetNavn,
        body.dark-mode .utvidetPoeng {
            color: #8CBEB2;
        }


        body.dark-mode .ingenResultater {
            color: #8CBEB2;
        }


        body.dark-mode .fullListeKnapp,
        body.dark-mode #visSkjulListeKnapp,
        body.dark-mode #tilbakeKnapp {
            color: #8CBEB2;
        }


        body.dark-mode input {
            background-color: #263238;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode input::placeholder {
            color: #8CBEB2;
        }


        body.dark-mode button {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #startKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #455A64;
        }


        body.dark-mode #startKnapp:not(:disabled) {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #sporsmal {
            color: #8CBEB2;
        }


        body.dark-mode #svaralternativer button.riktig {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #svaralternativer button.feil {
            background-color: #A94A4A;

            color: #F2EBBF;

            border-color: #A94A4A;
        }


        body.dark-mode #neste {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #avbrytKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #leverInnKnapp {
            background-color: #4F8A78;

            color: #F2EBBF;

            border-color: #4F8A78;
        }


        body.dark-mode #startPaNyttKnapp {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode #sluttresultat {
            color: #8CBEB2;
        }


        body.dark-mode #spillIgjen {
            background-color: #455A64;

            color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode .resultatrad,
        body.dark-mode .resultatPlassering,
        body.dark-mode .resultatNavn,
        body.dark-mode .resultatPoeng {
            color: #8CBEB2;
        }


        /* PROGRESSBAR DARK MODE */

        body.dark-mode .progressSirkel {
            border-color: #52706B;
        }


        body.dark-mode .progressSirkel.riktig {
            background-color: #8CBEB2;

            border-color: #8CBEB2;
        }


        body.dark-mode .progressSirkel.feil {
            background-color: #D96C6C;

            border-color: #D96C6C;
        }


        /* =========================
           MOBIL
           ========================= */

        @media (max-width: 600px) {

            body {
                margin: 0 auto;

                padding: 12px;
            }


            #spillHeader {
                top: 12px;

                left: 12px;
                right: 12px;
            }


            #darkModeToggle {
                top: 12px;

                right: 12px;
            }


            #poengVisning {
                font-size: 18px;
            }


            /* FORSIDE */

            #startside {
                padding: 10px 5px 0;

                margin-top: 115px;
            }


            #startside p {
                font-size: 19px;

                margin-bottom: 15px;
            }


            input {
                width: 280px;

                max-width: 90%;
            }


            #startKnapp {
                min-width: 175px;
            }


            #toppFemBoks {
                margin-top: 40px;

                padding-top: 5px;
            }


            .topplisteBryter {
                margin-bottom: 15px;
            }


            .periodeKnapp {
                padding: 8px 15px;

                font-size: 13px;

                min-width: 75px;
            }


            .toppRad,
            .utvidetRad {
                grid-template-columns: 40px 1fr 70px;

                width: 100%;

                max-width: 290px;
            }


            .toppNavn,
            .utvidetNavn {
                width: 100%;
            }


            /* QUIZ */

            #quiz {
                min-height: 100vh;

                margin-top: 0;

                padding: 88px 0 85px;

                box-sizing: border-box;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: flex-start;
            }


            #progressbar {
                top: 58px;

                gap: 9px;

                margin: 0;
            }


            .progressSirkel {
                width: 11px;

                height: 11px;
            }


            #sporsmal {
                font-size: 24px;

                margin: 0 auto 10px;

                padding: 0 10px;

                max-width: 500px;
            }


            #svaralternativer {
                margin-top: 12px;

                gap: 7px;
            }


            #svaralternativer button {
                width: 100%;

                max-width: 320px;

                min-height: 55px;
            }


            #neste {
                margin-top: 12px;

                padding: 11px 25px;
            }


            #avbrytOmrade {
                bottom: 12px;
            }


            #avbrytKnapp {
                min-width: 120px;

                padding: 8px 18px;

                font-size: 14px;
            }


            #toppFem h3,
            #resultatside h2 {
                font-size: 20px;
            }


            #resultatside {
                padding-top: 65px;

                padding-bottom: 30px;
            }


            .resultatrad {
                grid-template-columns: 35px 1fr 75px;

                width: 100%;

                max-width: 350px;
            }


            .resultatNavn {
                width: 100%;
            }


            #sluttresultat {
                font-size: 21px;

                margin: 10px 0 15px;
            }

        }

    </style>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =========================
         HEADER UNDER SPILLET
         ========================= -->

    <div
        id="spillHeader"
        style="display: none;"
    >

        <p id="poengVisning">
            <span id="poeng">0P</span>
        </p>

    </div>


    <!-- =========================
         DARK MODE
         ========================= -->

    <button
        id="darkModeToggle"
        onclick="toggleDarkMode()"
        aria-label="Bytt mellom lys og mørk modus"
    >

        <span id="toggleKnapp"></span>

        <span id="toggleIkon">☀️</span>

    </button>


    <!-- =========================
         FORSIDE
         ========================= -->

    <div id="startside">

        <p>
            Klar for å spille?
        </p>


        <input
            type="text"
            id="navn"
            placeholder="Ditt navn"
            autocomplete="off"
            maxlength="20"
        >


        <button
            id="startKnapp"
            onclick="startKonkurranse()"
            disabled
        >
            START
        </button>

    </div>


    <!-- =========================
         TOPPRESULTATER FORSIDE
         ========================= -->

    <div
        id="toppFemBoks"
        class="listeboks"
    >

        <div id="toppFem">

            <h3>
                Toppresultater
            </h3>


            <div class="topplisteBryter">

                <button
                    id="iDagKnappForside"
                    class="periodeKnapp aktiv"
                    onclick="visToppresultater('iDag', 'forside')"
                >
                    I dag
                </button>


                <button
                    id="totalKnappForside"
                    class="periodeKnapp"
                    onclick="visToppresultater('total', 'forside')"
                >
                    Total

        /* =========================

        function gyldigNavn(
            navnInput
        ) {

            let navnUtenStartOgSlutt =
                navnInput.trim();


            if (
                navnUtenStartOgSlutt.length > 20
            ) {

                return false;

            }


            let deler =
                navnUtenStartOgSlutt.split(
                    /\s+/
                );


            for (
                let del of deler
            ) {

                if (
                    del.length > 10
                ) {

                    return false;

                }

            }


            return (
                navnUtenStartOgSlutt.length > 0
            );

        }

        /* =========================
           HENT RESULTATER
           ========================= */

        async function hentResultater(
            periode
        ) {

            let query =
                supabaseClient
                    .from("Resultater")
                    .select(
                        "navn, poeng, created_at"
                    );


            if (
                periode === "iDag"
            ) {

                let na =
                    new Date();


                let start =
                    new Date(
                        na.getFullYear(),
                        na.getMonth(),
                        na.getDate()
                    );


                let slutt =
                    new Date(
                        na.getFullYear(),
                        na.getMonth(),
                        na.getDate() + 1
                    );


                query =
                    query
                        .gte(
                            "created_at",
                            start.toISOString()
                        )
                        .lt(
                            "created_at",
                            slutt.toISOString()
                        );

            }


            let resultat =
                await query
                    .order(
                        "poeng",
                        {
                            ascending: false
                        }
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            return resultat;

        }

            let innhold;


            if (

            } else {

            }


            oppdaterPeriodeKnapp(

                periode
            );


            innhold.innerHTML =

            if (
                plassering === "resultatside"
            ) {

                let knapp =
                    document.getElementById(
                        "visSkjulListeKnapp"
                    );

                knapp.style.display =
                    "none";

                knapp.textContent =
                    "Vis hele resultatlisten ↓";
            }


            let {
                data,
                error
            } =
                await hentResultater(
                    periode
                );


            if (
                error
            ) {

                innhold.innerHTML =
                    "<p class='ingenResultater'>Kunne ikke hente resultater.</p>";


                console.error(
                    "Feil ved henting av toppliste:",

                );


                return;

            if (

            ) {

                innhold.innerHTML =

                    (
                        periode === "iDag"
                            ? "Ingen resultater i dag ennå."
                            : "Ingen resultater ennå."
                    ) +

                return;

            /*

                    3
                );


            let resten =
                data.slice(

                );


            if (
                plassering === "resultatside" &&

            ) {

            innhold.innerHTML =

        }


        /* =========================
           VIS / SKJUL FULL LISTE
           ========================= */

        function visSkjulFullListe() {

            let liste =
                document.getElementById(
                    "utvidetListe-resultatside"
                );


            let knapp =
                document.getElementById(
                    "visSkjulListeKnapp"
                );


            if (!liste) {
                return;
            }


            if (
                liste.style.display ===
                "none"
            ) {

                liste.style.display =
                    "block";


                knapp.textContent =
                    "Skjul resultatlisten ↑";

            } else {

                liste.style.display =
                    "none";


                knapp.textContent =
                    "Vis hele resultatlisten ↓";

            }

        }


        /* =========================
           TILBAKE TIL START
           ========================= */

        function tilbakeTilStart() {

            location.reload();

        }


        /* =========================
           START MED I DAG
           ========================= */

        visToppresultater(
            "iDag",
            "forside"
        );

    </script>

</body>
</html>
